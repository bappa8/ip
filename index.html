<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My IP Info</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-bottom: 30px; font-size: 1.8rem; font-weight: 600; }
        .row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .row:last-child { border-bottom: none; }
        .label { color: #a0a0b8; font-size: 0.95rem; }
        .value { font-weight: 500; text-align: right; max-width: 60%; word-break: break-all; }
        .loading { text-align: center; color: #a0a0b8; padding: 20px 0; }
        .error { text-align: center; color: #ff6b6b; padding: 20px 0; }
        @media (max-width: 480px) {
            .card { padding: 24px; }
            h1 { font-size: 1.4rem; }
            .label, .value { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>IP Information</h1>
        <div id="content"><div class="loading">Loading...</div></div>
    </div>
    <script>
        function fetchWithTimeout(url, timeout = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
        }

        async function tryAPIs() {
            // 1. ipwho.is — HTTPS, free, no token, confirmed working
            try {
                const res = await fetchWithTimeout('https://ipwho.is/');
                const data = await res.json();
                if (data.success && data.ip) {
                    return {
                        ip:       data.ip,
                        country:  data.country,
                        city:     data.city,
                        timezone: data.timezone && data.timezone.id ? data.timezone.id : 'N/A',
                        org:      data.connection && (data.connection.isp || data.connection.org)
                                    ? (data.connection.isp || data.connection.org) : 'N/A'
                    };
                }
            } catch (e) { console.log('ipwho.is failed:', e); }

            // 2. ipapi.co — HTTPS fallback
            try {
                const res = await fetchWithTimeout('https://ipapi.co/json/');
                const data = await res.json();
                if (!data.error && data.ip) {
                    return {
                        ip:       data.ip,
                        country:  data.country_name,
                        city:     data.city,
                        timezone: data.timezone,
                        org:      data.org
                    };
                }
            } catch (e) { console.log('ipapi.co failed:', e); }

            // 3. Last resort: ipify (IP only)
            try {
                const res = await fetchWithTimeout('https://api.ipify.org?format=json');
                const data = await res.json();
                if (data.ip) {
                    return { ip: data.ip, country: 'N/A', city: 'N/A', timezone: 'N/A', org: 'N/A' };
                }
            } catch (e) { console.log('ipify failed:', e); }

            return null;
        }

        async function getIPv6() {
            try {
                const res = await fetchWithTimeout('https://api64.ipify.org?format=json');
                const d = await res.json();
                return (d.ip && d.ip.includes(':')) ? d.ip : 'N/A';
            } catch { return 'N/A'; }
        }

        async function load() {
            const content = document.getElementById('content');
            const [data, ipv6] = await Promise.all([tryAPIs(), getIPv6()]);

            if (!data) {
                content.innerHTML = '<div class="error">Failed to fetch IP information.<br>Please check your connection.</div>';
                return;
            }

            const rows = [
                { label: 'IPv4 Address',       value: data.ip },
                { label: 'IPv6 Address',       value: ipv6 },
                { label: 'Country',            value: data.country },
                { label: 'City',               value: data.city },
                { label: 'Time Zone',          value: data.timezone },
                { label: 'ISP / Organization', value: data.org }
            ];

            let html = '';
            for (const r of rows) {
                html += `<div class="row">
                    <span class="label">${r.label}</span>
                    <span class="value">${r.value || 'N/A'}</span>
                </div>`;
            }
            content.innerHTML = html;
        }

        load();
    </script>
</body>
</html>
